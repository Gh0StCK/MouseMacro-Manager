<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MouseMacro — менеджер действий</title>
<style>
:root{--bg:#f4f5f7;--ui:#fafbfc;--white:#fff;--border:#c7cbd2;--text:#1f2329;--muted:#606773;--accent:#0067c0;--sel:#dbeafe;--top:#e5f0fc;--disabled:#a0a5ad;--line:#e2e6eb}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:13px "Segoe UI",Arial,sans-serif;color:var(--text);overflow:hidden}
button,input,select{font:inherit}button{border:1px solid #adb4bd;border-radius:4px;background:linear-gradient(#fff,#f3f4f6);padding:7px 12px;color:#20232a;white-space:nowrap;min-height:33px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
button:hover:not(:disabled){background:linear-gradient(#fff,#e9f2ff);border-color:#8aaed8}button:active:not(:disabled){background:#dfeaf6}button:disabled{color:#a0a5ad;background:#f5f5f5;border-color:#d8dade;cursor:default}
button.default{background:#e4f0ff;border:1px solid #247cca;color:#074d90;font-weight:600}
button.danger{color:#bc2525}button.small{min-height:28px;padding:5px 9px;font-size:12px}
input,select{border:1px solid #aeb5be;border-radius:3px;background:#fff;padding:7px 8px;color:#222;min-height:33px}input:focus,select:focus{outline:1px solid #1673d2;border-color:#1673d2}input[type=number]{width:76px}input[type=text]{width:100%}input:disabled{color:#aaa;background:#f3f3f3}
.menubar{height:32px;display:flex;align-items:center;gap:2px;border-bottom:1px solid #d7dce3;background:#fafbfc;padding:0 15px}
.menu-wrap{position:relative} .menu-button{border:0;background:none;min-height:28px;font-size:13px;padding:4px 12px}.menu-button:hover{background:#e8f0fb}
.dropdown{position:absolute;z-index:10;top:100%;left:0;width:220px;background:#fff;border:1px solid #b8c2cf;box-shadow:0 7px 18px #0002;padding:5px;display:none;border-radius:4px;white-space:normal}
.menu-wrap.open .dropdown{display:block}.dropdown button{display:flex;width:100%;min-height:31px;border:0;background:transparent;justify-content:flex-start;text-align:left}.dropdown button:hover{background:#e9f2ff}
.toolbar{height:66px;display:flex;align-items:center;gap:9px;padding:13px 15px;border-bottom:1px solid #d0d4da;background:#fbfbfc;white-space:nowrap}.toolbar .sep{width:1px;height:28px;background:#c5cbd2;margin:0 2px}.toolbar .push{margin-left:auto}.btn-record{font-weight:600}.dot{color:#d5322c;font-size:16px}.play-icon{color:#278343;font-size:17px}.red{color:#c33}.field{display:inline-flex;align-items:center;gap:8px}.field label{font-size:12px}.field input{width:72px;height:33px}
.workspace{height:calc(100vh - 132px);min-height:250px;display:flex;background:#fafbfc}
.leftpanel{width:32%;max-width:360px;min-width:270px;border-right:1px solid #cdd1d7;padding:15px;background:#f6f7f9;display:flex;flex-direction:column;gap:9px}
.rightpanel{flex:1;min-width:400px;padding:15px;background:#fafbfc;display:flex;flex-direction:column;gap:9px}
.heading{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:600;min-height:22px}
.heading .sub{font-size:12px;color:#626b77;font-weight:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tablebox{flex:1;min-height:110px;background:#fff;border:1px solid #aeb5bf;overflow:auto}
table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:12px}th{position:sticky;top:0;background:linear-gradient(#fafcfe,#e9edf3);font-weight:600;text-align:left;border-right:1px solid #d4d9df;border-bottom:1px solid #c8cdd3;padding:8px 7px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}td{padding:7px 8px;border-right:1px solid #edf0f4;border-bottom:1px solid #edf0f4;text-overflow:ellipsis;overflow:hidden;white-space:nowrap;height:32px}
tr{cursor:default}tr:hover:not(.selected){background:#f0f6ff}tr.selected{background:#cfe3fb;color:#172d4b}tr:focus{outline:1px solid #4d93dd;outline-offset:-1px}.placeholder td{color:#9ca4af;text-align:center;height:70px}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.actions button{font-size:12px}.actions.flexend{justify-content:flex-end}
.step-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.step-actions .group{display:flex;gap:8px}.step-actions button{padding:6px 10px}
.footer{height:34px;border-top:1px solid #cdd1d7;display:flex;align-items:center;justify-content:space-between;background:#f0f2f6;padding:0 17px;color:#4f5864;white-space:nowrap}.state-lamp{width:11px;height:11px;display:inline-block;border-radius:50%;background:#36b548;border:1px solid #279736;box-shadow:0 0 0 1px #fff;margin-right:8px}.state-lamp.recording{background:#d93235;border-color:#ab2428;animation:pulse 1.1s infinite}.state-lamp.playing{background:#f3a02d;border-color:#cd7a10}@keyframes pulse{50%{opacity:.35}}
#status{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:min(80vw,950px)}.foottext{display:flex;align-items:center;font-size:12px}
.overlay{position:fixed;inset:0;z-index:50;background:#0e233b64;display:none;align-items:center;justify-content:center;padding:22px}.overlay.visible{display:flex}.modal{background:#f8f9fb;border:1px solid #9cacbf;box-shadow:0 12px 40px #0015;border-radius:8px;min-width:340px;width:420px;max-width:95vw;max-height:92vh;overflow:auto}.modal.wide{width:485px}.modal-title{background:linear-gradient(#e7f2ff,#dceaf8);border-bottom:1px solid #bbccdd;padding:12px 15px;font-weight:600;display:flex;justify-content:space-between;align-items:center;font-size:14px}.modal-title .close{border:none;padding:0 6px;min-height:24px;background:none;font-size:20px;color:#4b5a6a}.modal-content{padding:17px 19px}.modal-content label{display:block;font-weight:500;margin-bottom:7px}.modal-content .hint{font-size:12px;line-height:1.5;color:#667181;margin:6px 0 14px}.modal-actions{display:flex;gap:8px;justify-content:flex-end;border-top:1px solid #e0e4e8;padding:12px 18px}.inlineform{display:flex;gap:9px;align-items:center;margin:8px 0}.inset{background:#edf4fd;border:1px solid #c7d9ef;border-radius:4px;padding:10px 12px;color:#3b5676;font-size:12px;line-height:1.4}.form-row{margin:0 0 14px}.form-row input[type=text]{width:100%}.form-row .group{display:flex;gap:9px;align-items:center}.fileline{display:flex;gap:7px}.fileline input{flex:1;min-width:0}.image-preview{border:1px solid #cbd3dc;background:repeating-conic-gradient(#f2f5f9 0% 25%,#e0e6ed 0% 50%) 50% / 15px 15px;height:92px;display:flex;align-items:center;justify-content:center;border-radius:5px;margin:8px 0}.image-preview img{max-height:80px;max-width:100%;object-fit:contain}.image-preview .fallback{color:#728095;font-size:12px}.toast{position:fixed;bottom:48px;right:18px;border:1px solid #bccfe4;background:#eff6ff;box-shadow:0 4px 15px #0002;border-radius:5px;z-index:90;padding:10px 15px;display:none;max-width:400px}
.key-preview{display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;border:1px solid #aeb5bf;background:#fff;height:70px;border-radius:4px;color:#1d2a3a}.scrollhint{color:#667181;font-size:12px}
@media(max-width:950px){.toolbar{gap:5px;padding:10px}.toolbar button{padding:6px 8px}.leftpanel{min-width:240px;width:30%}.rightpanel{min-width:360px}.workspace{overflow:auto}}

/* Recording: one stateful primary button and a contextual cancel button. */
[hidden]{display:none !important}
.record-controls{display:flex;gap:7px;align-items:center;flex-shrink:0}
#record{min-width:142px}
#record-cancel{min-width:91px}
#record-cancel:not(:disabled){color:#ad2828;border-color:#d4a4a4;background:#fff8f8}
/* Consistent layout for all step controls. */
.step-action-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;align-items:stretch}
.step-action-grid > button,.step-move-pair > button{width:100%;min-width:0;min-height:36px;height:36px;padding:6px;font-size:12px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step-heading-tools{display:flex;align-items:center;gap:10px;min-width:0}
.step-heading-tools .sub{min-width:0}
.step-heading-tools button{min-height:26px;padding:4px 8px;font-weight:400;font-size:12px}
#step-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.step-move-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;min-width:0}
@media(max-width:990px){.step-action-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}


/* Adaptive workspace: menus and toolbars can wrap without overlapping tables. */
html,body{height:100%}
body{display:flex;flex-direction:column}
.menubar,.toolbar,.footer{flex-shrink:0}
.toolbar{height:auto;min-height:66px;flex-wrap:wrap;white-space:normal}
.workspace{height:auto;min-height:0;flex:1}
.tablebox{min-height:95px}
.rightpanel,.leftpanel{min-height:0}
.image-check{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:5px 0}
.image-check button{min-height:30px;padding:5px 9px}
.image-check span{font-size:11px;color:var(--muted);flex:1;min-width:125px}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid #0067c0;outline-offset:1px}
@media(max-width:1040px){.toolbar{gap:6px;padding:8px 12px}.toolbar button{padding:6px 8px}.leftpanel{min-width:260px;width:34%}.rightpanel{min-width:380px}.step-action-grid{gap:6px}}

</style>
</head>
<body>
<div class="menubar">
 <div class="menu-wrap"><button class="menu-button" data-menu="file">Файл</button><div class="dropdown" id="menu-file"><button data-action="new">Новая запись</button><button data-action="exit">Выход</button></div></div>
 <div class="menu-wrap"><button class="menu-button" data-menu="macro">Макрос</button><div class="dropdown" id="menu-macro"><button data-action="play">Воспроизвести</button><button data-action="rename">Переименовать</button><button data-action="rekey">Сменить клавишу</button><button data-action="copy">Копировать</button><button data-action="deleteMacro">Удалить</button></div></div>
 <div class="menu-wrap"><button class="menu-button" data-menu="service">Сервис</button><div class="dropdown" id="menu-service"><button data-action="addClicks">Добавить клики</button><button data-action="wait_image">Ждать изображение</button><button data-action="delay">Изменить паузы</button></div></div>
 <div class="menu-wrap"><button class="menu-button" data-menu="help">Справка</button><div class="dropdown" id="menu-help"><button data-action="help">Как пользоваться</button><button data-action="checkUpdate">Проверить обновления</button><button data-action="about">О программе</button></div></div>
</div>
<div class="toolbar">
 <div class="record-controls"><button class="btn-record" id="record" data-action="new"><span class="dot">●</span> Записать</button><button class="record-cancel" id="record-cancel" data-action="cancelRecord" hidden>✕ Отмена</button></div>
 <button id="play" data-action="play"><span class="play-icon">▶</span> Воспроизвести</button>
 <span class="sep"></span>
 <button id="rename" data-action="rename">✎ Переименовать</button>
 <button id="rekey" data-action="rekey">⌨ Сменить клавишу</button>
 <div class="field push"><label for="repeat">Повторы:</label><input id="repeat" type="number" min="1" max="1000" value="1"></div>
</div>
<div class="workspace">
 <aside class="leftpanel">
  <div class="heading"><span>Макросы (<span id="macro-count">0</span>)</span></div>
  <div class="tablebox"><table><colgroup><col style="width:56%"><col style="width:24%"><col style="width:20%"></colgroup><thead><tr><th>Название</th><th>Клавиша</th><th>Шагов</th></tr></thead><tbody id="macro-list"><tr class="placeholder"><td colspan="3">Макросов пока нет</td></tr></tbody></table></div>
  <div class="actions"><button data-action="new">＋ Добавить</button><button id="copy" data-action="copy">▣ Копировать</button><button id="delete" class="danger" data-action="deleteMacro">✕ Удалить</button></div>
 </aside>
 <main class="rightpanel">
  <div class="heading"><span id="step-title">Шаги макроса: —</span><div class="step-heading-tools"><span class="sub" id="step-counter"></span><button class="small" data-action="selectAll">Выделить все</button></div></div>
  <div class="tablebox"><table><colgroup><col style="width:7%"><col style="width:70%"><col style="width:23%"></colgroup><thead><tr><th>№</th><th>Действие</th><th>Пауза перед</th></tr></thead><tbody id="step-list"><tr class="placeholder"><td colspan="3">Выберите макрос слева</td></tr></tbody></table></div>
  <div class="step-action-grid">
    <button data-action="addClicks">⌖ Добавить клики</button>
    <button data-action="duplicateStep" title="Дублировать выбранные шаги (Ctrl+D)">▣ Дублировать</button>
    <button data-action="wait_image">◷ Ждать изображение</button>
    <div class="step-move-pair"><button data-action="moveUp" title="Поднять шаг">▲ Вверх</button><button data-action="moveDown" title="Опустить шаг">▼ Вниз</button></div>
    <button data-action="delay">◷ Изменить паузы</button>
    <button data-action="editStep">⚙ Редактировать шаг</button>
    <button class="danger" data-action="deleteStep">✕ Удалить шаг</button>
    <button data-action="undoStep" title="Отменить последнее изменение шагов (Ctrl+Z)">↶ Отменить</button>
  </div>
 </main>
</div>
<div class="footer"><div class="foottext"><span class="state-lamp" id="lamp"></span><span id="status">Готово — F9 для аварийной остановки</span></div><span class="foottext" id="side-status">v22.11-UIKEY • Ctrl+Alt+R — запись • F9 — стоп</span></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"><div class="modal-title"><span id="modal-title"></span><button class="close" id="close-modal" title="Закрыть">×</button></div><div class="modal-content" id="modal-content"></div><div class="modal-actions" id="modal-actions"><button id="modal-ok" class="default">Сохранить</button><button id="modal-cancel">Отмена</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
let S = {macros:[],selected:0,steps:[],rows:[],recording:false,playing:false,status:'Готово',version:'—'};
let selection = [], anchor = 0, modalAction = null, previewPath = '', previewData = '', keyCaptureListener = null, keyMouseCaptureListener = null, keyWheelCaptureListener = null, keyPickerActive=false;
let lastMacroMarkup = null;
let lastStepMarkup = null; // Preserve row DOM between clicks so dblclick can fire.
const host = !!(window.chrome && window.chrome.webview && window.chrome.webview.hostObjects);
function call(cmd,...args){if(!host){toast('Демонстрационный режим HTML: открой через AHK.');return;}try{window.chrome.webview.hostObjects.sync.Action(cmd,...args.map(x=>String(x??'')));}catch(e){toast('Ошибка связи с AHK: '+e.message);}}
function toast(txt){const t=$('#toast');t.textContent=txt;t.style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.style.display='none',4000)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function selectedMacro(){return S.macros.find(m=>m.id===S.selected)}
function displayKey(k){const raw=String(k||'');const names={'^':'Ctrl','!':'Alt','+':'Shift','#':'Win'};let i=0,parts=[];while(i<raw.length&&names[raw[i]])parts.push(names[raw[i++]]);return [...parts,raw.slice(i)].filter(Boolean).join(' + ')}
function render(){
 $('#macro-count').textContent=S.macros.length;
 const macroMarkup=S.macros.length?S.macros.map(m=>`<tr data-id="${m.id}" tabindex="0"><td>${esc(m.name)}</td><td>${esc(displayKey(m.key))}</td><td>${m.count}</td></tr>`).join(''):'<tr class="placeholder"><td colspan="3">Макросов пока нет — нажми «Записать»</td></tr>';
 if(macroMarkup!==lastMacroMarkup){$('#macro-list').innerHTML=macroMarkup;lastMacroMarkup=macroMarkup;}
 $('#macro-list').querySelectorAll('tr[data-id]').forEach(row=>row.classList.toggle('selected',Number(row.dataset.id)===S.selected));
 // Refresh row markup only when step contents change, not when selection changes.
 // Replacing <tr> after the first click prevents a normal browser dblclick.
 const stepMarkup=S.steps.length?S.steps.map(s=>`<tr data-row="${s.n}" tabindex="0"><td>${s.n}</td><td title="${esc(s.detail)}">${esc(s.detail)}</td><td>${s.delay} мс</td></tr>`).join(''):'<tr class="placeholder"><td colspan="3">'+(selectedMacro()?'Шагов пока нет':'Выбери макрос слева')+'</td></tr>';
 if(stepMarkup!==lastStepMarkup){$('#step-list').innerHTML=stepMarkup;lastStepMarkup=stepMarkup;}
 $('#step-list').querySelectorAll('tr[data-row]').forEach(row=>row.classList.toggle('selected',selection.includes(Number(row.dataset.row))));
 const macro=selectedMacro(),busy=S.recording||S.playing;
 $('#step-title').textContent='Шаги макроса: '+(macro?macro.name:'—');
 $('#step-counter').textContent=macro?'Шагов: '+S.steps.length+' · Повторов: '+macro.repeat:'';
 if(document.activeElement!==$('#repeat')) $('#repeat').value=macro?macro.repeat:1;
 $('#repeat').disabled=!macro||busy;
 $('#lamp').className='state-lamp'+(S.recording?' recording':S.playing?' playing':'');
 $('#status').textContent=S.status||'Готово — F9 для аварийной остановки';
 $('#record').innerHTML=S.recording?'<span class="dot">●</span> Сохранить запись':'<span class="dot">●</span> Записать';
 $('#record').dataset.action=S.recording?'finish':'new';
 $('#record').disabled=S.playing;
 $('#record-cancel').hidden=!S.recording;
 $('#record-cancel').disabled=!S.recording;
 $('#play').disabled=!macro||busy;
 ['rename','rekey','copy','delete'].forEach(id=>$('#'+id).disabled=!macro||busy);
 document.querySelectorAll('[data-action]').forEach(b=>{
  if(!b.id && !['new','help','about','checkUpdate','exit','finish','cancelRecord','play','rename','rekey','copy','deleteMacro'].includes(b.dataset.action)) b.disabled=!macro||busy;
 });
 $('#side-status').textContent='v'+(S.version||'—')+' • '+(S.playing?'F9 — остановить воспроизведение':S.recording?'Ctrl+Alt+R — сохранить • Ctrl+Alt+Esc — отменить':'Ctrl+Alt+R — запись • F9 — стоп');
}
function closeMenus(){document.querySelectorAll('.menu-wrap.open').forEach(x=>x.classList.remove('open'))}
function openModal(title,html,onOK,opt={}){modalAction=onOK;previewPath='';previewData='';$('#modal-title').textContent=title;$('#modal-content').innerHTML=html;$('#modal').classList.toggle('wide',!!opt.wide);$('#modal-ok').textContent=opt.okText||'Сохранить';$('#modal-ok').style.display=opt.noOK?'none':'';$('#overlay').classList.add('visible');setTimeout(()=>$('#modal-content').querySelector('input:not([type=hidden])')?.focus(),50)}
function closeModal(){if(keyCaptureListener){window.removeEventListener('keydown',keyCaptureListener,true);keyCaptureListener=null;}if(keyMouseCaptureListener){window.removeEventListener('mousedown',keyMouseCaptureListener,true);keyMouseCaptureListener=null;}if(keyWheelCaptureListener){window.removeEventListener('wheel',keyWheelCaptureListener,true);keyWheelCaptureListener=null;}if(keyPickerActive){keyPickerActive=false;call('picker','off');}modalAction=null;$('#overlay').classList.remove('visible')}
$('#close-modal').onclick=closeModal;$('#modal-cancel').onclick=closeModal;$('#modal-ok').onclick=()=>{if(modalAction)modalAction()};
$('#overlay').addEventListener('click',e=>{if(e.target===$('#overlay'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMenus();closeModal()}});
// Keyboard shortcuts affect steps only outside modal/input fields.
document.addEventListener('keydown',e=>{
 if(!e.ctrlKey||e.shiftKey||e.altKey||e.metaKey||!['d','z'].includes(e.key.toLowerCase()))return;
 if($('#overlay').classList.contains('visible'))return;
 if(e.target.closest('input,textarea,select,[contenteditable]'))return;
 e.preventDefault();
 action(e.key.toLowerCase()==='d'?'duplicateStep':'undoStep');
});
// Enter confirms an editor dialog from its text/number fields.
// Do not intercept the hotkey picker, buttons, or keyboard shortcuts.
$('#overlay').addEventListener('keydown',e=>{
 if(e.key!=='Enter'||e.isComposing||e.repeat||keyPickerActive||e.ctrlKey||e.altKey||e.metaKey)return;
 const field=e.target;
 if(!(field instanceof HTMLInputElement)||!['text','number'].includes(field.type))return;
 if($('#modal-ok').style.display==='none')return;
 e.preventDefault();
 $('#modal-ok').click();
});
const fld=(label,id,value='',hint='')=>`<div class="form-row"><label for="${id}">${label}</label><input id="${id}" type="text" value="${esc(value)}">${hint?`<div class="hint">${esc(hint)}</div>`:''}</div>`;
// Local application UI: no browser history, page reload, zoom, save, print or dragging.
// Native WebView2 settings and AHK XButton hooks provide a second line of defence.
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('dragstart',e=>e.preventDefault());
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>e.preventDefault());
window.addEventListener('auxclick',e=>{if(e.button===3||e.button===4)e.preventDefault();},true);
window.addEventListener('mouseup',e=>{if(e.button===3||e.button===4)e.preventDefault();},true);
document.addEventListener('keydown',e=>{
 // Preserve editing (including Copy/Paste), macro commands and key-picker capture.
 if(keyPickerActive)return;
 const key=e.key.toLowerCase();
 const browserShortcut=(e.altKey&&['arrowleft','arrowright','home'].includes(key))
  || ((e.ctrlKey||e.metaKey)&&['r','p','s','l','+','-','=','0'].includes(key))
  || (key==='f5'||key==='f12'||(e.ctrlKey&&e.shiftKey&&['i','j'].includes(key)))
  || (key==='backspace'&&!e.target.closest('input,textarea,[contenteditable]'));
 if(browserShortcut)e.preventDefault();
},true);

function hotkeyModifiers(e){return (e.ctrlKey?'^':'')+(e.altKey?'!':'')+(e.shiftKey?'+':'');}
function isProtectedKey(combo){
 if(!combo||combo.includes('#'))return true;
 const b=combo.replace(/[\^!+]/g,'').toLowerCase();
 const ctrl=combo.includes('^'),alt=combo.includes('!'),shift=combo.includes('+');
 return b==='f9'
  ||(ctrl&&alt&&['r','esc','delete'].includes(b))
  ||(ctrl&&shift&&b==='esc')
  ||(alt&&['tab','f4','esc','space'].includes(b))
  ||(ctrl&&!alt&&!shift&&['d','z'].includes(b))
  ||(!ctrl&&!alt&&!shift&&['esc','tab','enter','backspace','delete','space','capslock','scrolllock','printscreen','appskey','pause'].includes(b))
  ||['lbutton','rbutton'].includes(b)
  ||(b.startsWith('wheel')&&!(ctrl||alt||shift))
  ||b.startsWith('browser_');
}
function keyName(e){
 const keys={Escape:'Esc',' ':'Space',ArrowUp:'Up',ArrowDown:'Down',ArrowLeft:'Left',ArrowRight:'Right',Delete:'Delete',Insert:'Insert',Backspace:'Backspace',PageUp:'PgUp',PageDown:'PgDn',Home:'Home',End:'End',Enter:'Enter',Tab:'Tab',CapsLock:'CapsLock',ScrollLock:'ScrollLock',Pause:'Pause',PrintScreen:'PrintScreen',ContextMenu:'AppsKey',AudioVolumeUp:'Volume_Up',AudioVolumeDown:'Volume_Down',AudioVolumeMute:'Volume_Mute',MediaPlayPause:'Media_Play_Pause',MediaStop:'Media_Stop',MediaTrackPrevious:'Media_Prev',MediaTrackNext:'Media_Next',BrowserBack:'Browser_Back',BrowserForward:'Browser_Forward',BrowserRefresh:'Browser_Refresh',BrowserStop:'Browser_Stop',BrowserSearch:'Browser_Search',BrowserFavorites:'Browser_Favorites',BrowserHome:'Browser_Home'};
 const num={NumpadAdd:'NumpadAdd',NumpadSubtract:'NumpadSub',NumpadMultiply:'NumpadMult',NumpadDivide:'NumpadDiv',NumpadDecimal:'NumpadDot',NumpadEnter:'NumpadEnter'};
 const punctuation={Backquote:'sc029',Minus:'sc00C',Equal:'sc00D',BracketLeft:'sc01A',BracketRight:'sc01B',Backslash:'sc02B',Semicolon:'sc027',Quote:'sc028',Comma:'sc033',Period:'sc034',Slash:'sc035',IntlBackslash:'sc056'};
 if(['Control','Alt','Shift','Meta','AltGraph','Process','Dead'].includes(e.key)||e.metaKey)return '';
 let k=num[e.code]||(/^(Numpad[0-9])$/.test(e.code)?e.code:null)||punctuation[e.code]||keys[e.key]||(/^(Key[A-Z])$/.test(e.code)?e.code.slice(3).toLowerCase():null)||(/^(Digit[0-9])$/.test(e.code)?e.code.slice(5):null)||e.key;
 if(k.length===1)k=k.toLowerCase();
 if(!/^(?:F(?:[1-9]|1[0-9]|2[0-4])|[a-z0-9]|sc(?:0(?:0[CD]|1[AB]|27|28|29|2B|33|34|35|56))|Numpad(?:[0-9]|Add|Sub|Mult|Div|Dot|Enter)|Space|Esc|Up|Down|Left|Right|Delete|Insert|Backspace|PgUp|PgDn|Home|End|Enter|Tab|CapsLock|ScrollLock|Pause|PrintScreen|AppsKey|Volume_(?:Up|Down|Mute)|Media_(?:Play_Pause|Stop|Prev|Next)|Browser_(?:Back|Forward|Refresh|Stop|Search|Favorites|Home))$/.test(k))return '';
 return hotkeyModifiers(e)+k;
}
function keyModal(mode){
 keyPickerActive=true;call('picker','on');
 const cap=mode==='new'?'Горячая клавиша нового макроса':mode==='copy'?'Клавиша для копии':'Сменить горячую клавишу';
 let current=mode==='rekey'?(selectedMacro()?.key||''):'';
 openModal(cap,`<label>Нажми клавишу, сочетание или боковую кнопку мыши:</label><div class="key-preview" id="key-preview">${esc(current?displayKey(current):'Нажми клавиши или боковую кнопку')}</div><div class="hint">Поддерживаются F1–F24, буквы, цифры, NumPad, клавиши навигации, XButton1/XButton2 и средняя кнопка мыши, в том числе с Ctrl/Alt/Shift. Win и системные сочетания запрещены; F9 и Ctrl+Alt+R/Esc зарезервированы. Одиночная буква перехватывается во всех приложениях.</div>`,()=>{
  if(!current)return toast('Сначала нажми допустимую клавишу или кнопку.');
  if(isProtectedKey(current))return toast('Эта клавиша зарезервирована. Выбери другую.');
  closeModal();call(mode==='new'?'startRecording':mode,current);
 },{okText:'Подтвердить'});
 const setKey=v=>{if(!v||!$('#key-preview'))return;
  if(isProtectedKey(v))return toast('Системная или служебная клавиша: выбери другую.');
  current=v;$('#key-preview').textContent=displayKey(v);
 };
 function capture(e){if(!$('#overlay').classList.contains('visible')||!$('#key-preview'))return;
  e.preventDefault();e.stopPropagation();setKey(keyName(e));
 }
 function captureMouse(e){if(!$('#overlay').classList.contains('visible')||!$('#key-preview'))return;
  // Standard left/right buttons are needed to operate the dialog.
  if(e.button===1||e.button===3||e.button===4){e.preventDefault();e.stopPropagation();setKey(hotkeyModifiers(e)+({1:'MButton',3:'XButton1',4:'XButton2'}[e.button]));}
 }
 function captureWheel(e){if(!$('#overlay').classList.contains('visible')||!$('#key-preview'))return;
  if(!e.ctrlKey&&!e.altKey&&!e.shiftKey)return;
  e.preventDefault();e.stopPropagation();setKey(hotkeyModifiers(e)+(e.deltaY<0?'WheelUp':'WheelDown'));
 }
 keyCaptureListener=capture;keyMouseCaptureListener=captureMouse;keyWheelCaptureListener=captureWheel;
 window.addEventListener('keydown',capture,true);
 window.addEventListener('mousedown',captureMouse,true);
 window.addEventListener('wheel',captureWheel,{capture:true,passive:false});
 // AHK consumes XButton events before Chromium; it supplies capturedHotkey.
 window.__applyCapturedMouseKey=setKey;
}

function delayModal(){const selected=S.steps.filter(s=>selection.includes(s.n));if(!selected.length){toast('Сначала выдели один или несколько шагов.');return;}const same=selected.every(s=>s.delay===selected[0].delay);openModal(selected.length===1?'Изменить паузу':'Массовое изменение пауз',`<label>Пауза ПЕРЕД ${selected.length===1?'шагом №'+selected[0].n:selected.length+' выбранными шагами'}</label><div class="inlineform"><input type="number" id="delay-input" min="0" max="600000" value="${same?selected[0].delay:''}" placeholder="мс"> мс</div><div class="inset">1000 мс = 1 секунда. Изменение применяется ко всем выделенным шагам.</div>`,()=>{const raw=$('#delay-input').value.trim();if(!/^\d+$/.test(raw))return toast('Введи задержку от 0 до 600000 мс');const val=Number(raw);if(!Number.isInteger(val)||val>600000)return toast('Нужна задержка от 0 до 600000 мс');call('delay',val);closeModal()},{okText:'Применить'})}
function clickModal(step){
 if(!step||!['click','wheel'].includes(step.type))return toast('Выбери клик или прокрутку мыши.');
 const buttons=[['LButton','Левая кнопка'],['RButton','Правая кнопка'],['MButton','Средняя кнопка'],['WheelUp','Колесо вверх'],['WheelDown','Колесо вниз']];
 openModal('Редактирование шага №'+step.n,`<div class="form-row"><label for="edit-x">Координата X:</label><input id="edit-x" type="number" step="1" value="${step.x}"></div><div class="form-row"><label for="edit-y">Координата Y:</label><input id="edit-y" type="number" step="1" value="${step.y}"></div><div class="form-row"><label for="edit-button">Действие мыши:</label><select id="edit-button">${buttons.map(([v,label])=>`<option value="${v}" ${step.button===v?'selected':''}>${label}</option>`).join('')}</select></div><div class="form-row"><label for="edit-delay">Пауза ПЕРЕД шагом, мс:</label><input id="edit-delay" type="number" min="0" max="600000" step="1" value="${step.delay}"></div><div class="inset">Здесь меняются направление прокрутки или кнопка, координаты и пауза одного шага. Для нескольких пауз используй «Изменить паузы».</div>`,()=>{
   const x=$('#edit-x').value.trim(),y=$('#edit-y').value.trim(),d=$('#edit-delay').value.trim(),b=$('#edit-button').value;
   if(!/^-?\d+$/.test(x)||! /^-?\d+$/.test(y)||! /^\d+$/.test(d))return toast('Координаты должны быть целыми числами, пауза — неотрицательной.');
   if(![x,y].every(v=>Math.abs(Number(v))<=100000)||Number(d)>600000)return toast('Координаты: -100000…100000; пауза: 0…600000 мс.');
   call('editClick',step.n,x,y,b,d);
 },{okText:'Применить'});
}
function imageModal(kind, original=null){if(kind!=='wait_image')return toast('Клик по изображению удалён. Удали старый шаг и запиши обычный клик.');let editing=!!original, path=original?.image||'',timeout=original?.timeout??10000,variation=original?.variation??0,button='LButton',delay=original?.delay??0;const title='Ожидание изображения';
 openModal(editing?'Настроить: '+title:title,`<div class="form-row"><label>Файл изображения:</label><div class="fileline"><input type="text" id="img-path" placeholder="PNG, BMP или JPG" value="${esc(path)}"><button id="browse" type="button">Обзор...</button></div><div class="image-preview" id="image-preview"><span class="fallback">Предпросмотр образца</span></div><div class="image-check"><button id="img-test" type="button">⌕ Проверить изображение</button><span>Окно временно скроется. Клик не выполняется.</span></div></div><div class="form-row"><label>Максимальное ожидание:</label><div class="inlineform"><input id="img-timeout" type="number" min="0" max="60000" value="${timeout}"> мс</div><div class="hint">0 — однократная проверка, максимум 60 000 мс</div></div><div class="form-row"><label>Допуск цвета (0–255):</label><div class="inlineform"><input id="img-variation" type="number" min="0" max="255" value="${variation}"> / 255</div></div>${kind==='image_click'?`<div class="form-row"><label>Кнопка мыши:</label><select id="img-button"><option value="LButton" ${button==='LButton'?'selected':''}>Левая</option><option value="RButton" ${button==='RButton'?'selected':''}>Правая</option><option value="MButton" ${button==='MButton'?'selected':''}>Средняя</option></select></div>`:''}<div class="form-row"><label>Пауза перед шагом:</label><div class="inlineform"><input id="img-delay" type="number" min="0" max="600000" value="${delay}"> мс</div></div><div class="inset">${kind==='image_click'?'Если изображение не найдено, клик будет пропущен.':'Если изображение не появится за отведённое время, макрос остановится.'}</div>`,()=>{
  const p=$('#img-path').value.trim(),tRaw=$('#img-timeout').value.trim(),vRaw=$('#img-variation').value.trim(),dRaw=$('#img-delay').value.trim();
  if(![tRaw,vRaw,dRaw].every(x=>/^\d+$/.test(x)))return toast('Все числовые поля должны быть заполнены целыми числами');
  const t=Number(tRaw),v=Number(vRaw),d=Number(dRaw);if(!p)return toast('Выбери файл изображения');if(![t,v,d].every(Number.isInteger)||t<0||t>60000||v<0||v>255||d<0||d>600000)return toast('Проверь числовые значения');call('imageSave',kind,p,t,v,$('#img-button')?.value||'LButton',d,original?.n||0);
 },{wide:true,okText:'Сохранить'});
 $('#browse').onclick=()=>call('browseImage');$('#img-test').onclick=()=>call('testImage',$('#img-path').value.trim(),$('#img-variation').value);if(path)call('previewImage',path);
}
function modalConfirm(title,text,fn){openModal(title,`<p style="line-height:1.5">${esc(text)}</p>`,()=>{fn();closeModal()},{okText:'Подтвердить'})}
function action(action){closeMenus();const busy=S.recording||S.playing;const m=selectedMacro();if(action==='new'){if(busy)return toast('Сначала заверши текущую запись или воспроизведение.');return keyModal('new');}if(action==='finish')return call('finishRecording');if(action==='cancelRecord')return call('cancelRecording');if(action==='stop')return call('stop');if(action==='help')return call('help');
 if(action==='about')return openModal('О программе',`<p><strong>MouseMacro Manager</strong></p><p>Версия: <strong>${esc(S.version||'—')}</strong></p><p>Локальная программа на AutoHotkey v2 + WebView2.</p><p>Обновления загружаются из официального репозитория Gh0StCK/MouseMacro-Manager на GitHub. Макросы и изображения не заменяются.</p>`,()=>{closeModal();openModal('Проверка обновлений','<p>Проверяю доступные версии на GitHub…</p>',null,{noOK:true});call('checkUpdate')},{okText:'Проверить обновления'});
 if(action==='checkUpdate'){if(busy)return toast('Сначала заверши запись или воспроизведение.');openModal('Проверка обновлений','<p>Проверяю доступные версии на GitHub…</p>',null,{noOK:true});return call('checkUpdate');}
 if(action==='exit')return modalConfirm('Выход','Завершить программу? Во время записи лучше сначала сохранить её сочетанием Ctrl+Alt+R.',()=>call('exit'));
 if(action==='undoStep'){if(busy)return toast('Сначала закончи запись или воспроизведение.');return call('undoStep');}
 if(!m)return toast('Выбери макрос слева');if(busy)return toast('Сначала закончи запись или воспроизведение.');
 if(action==='play')return call('play');if(action==='rename')return openModal('Переименовать макрос',fld('Название:','name',m.name),()=>{let v=$('#name').value.trim();if(!v)return toast('Название не может быть пустым');call('rename',v);closeModal()});
 if(action==='rekey')return keyModal('rekey');if(action==='copy')return keyModal('copy');if(action==='deleteMacro')return modalConfirm('Удалить макрос?','Будет удалён «'+m.name+'» вместе со всеми '+m.count+' шагами.',()=>call('deleteMacro'));
 if(action==='addClicks')return call('recordExtra');if(action==='wait_image'){if(selection.length>1)return toast('Для вставки выбери один шаг или сними выделение.');return imageModal(action)}
 if(action==='editStep'){if(selection.length!==1)return toast('Выбери один шаг.');const st=S.steps.find(s=>s.n===selection[0]);if(!st)return toast('Шаг не найден.');if(st.type==='click'||st.type==='wheel')return clickModal(st);if(st.type==='wait_image')return imageModal('wait_image',st);return toast('Клик по изображению удалён. Удали этот устаревший шаг или запиши обычный клик.');}
 if(action==='duplicateStep'){if(!selection.length)return toast('Сначала выдели один или несколько шагов');return call('duplicateStep');}
 if(action==='delay')return delayModal();if(action==='selectAll'){selection=S.steps.map(s=>s.n);call('selectSteps',selection.join(','));return render()}
 if(action==='moveUp'||action==='moveDown'){if(selection.length!==1)return toast('Для перемещения выбери один шаг');return call(action)}
 if(action==='deleteStep'){if(!selection.length)return toast('Сначала выдели шаги для удаления');if(selection.length===S.steps.length)return toast('Нельзя удалить все шаги: удали макрос целиком');if(selection.length>1)return modalConfirm('Удалить выбранные шаги?','Будут удалены '+selection.length+' шагов. Паузы удалённых шагов перейдут к следующим оставшимся шагам.',()=>call('deleteStep'));return call('deleteStep')}
}
document.addEventListener('click',e=>{const menuBtn=e.target.closest('[data-menu]');if(menuBtn){const owner=menuBtn.closest('.menu-wrap');const was=owner.classList.contains('open');closeMenus();owner.classList.toggle('open',!was);return}const row=e.target.closest('[data-id]');if(row){selection=[];anchor=0;call('selectMacro',row.dataset.id);return}const step=e.target.closest('[data-row]');if(step){const n=Number(step.dataset.row);if(e.shiftKey&&anchor){const low=Math.min(anchor,n),high=Math.max(anchor,n);selection=S.steps.filter(s=>s.n>=low&&s.n<=high).map(s=>s.n)}else if(e.ctrlKey){selection=selection.includes(n)?selection.filter(x=>x!==n):[...selection,n];anchor=n}else{selection=[n];anchor=n}call('selectSteps',selection.join(','));render();return}const actionBtn=e.target.closest('[data-action]');if(actionBtn&&!actionBtn.disabled){action(actionBtn.dataset.action);return}if(!e.target.closest('.menu-wrap'))closeMenus()});
$('#repeat').addEventListener('change',()=>{const v=Number($('#repeat').value);if(!Number.isInteger(v)||v<1||v>1000){toast('Повторы: от 1 до 1000');render();return}call('repeat',v)});
$('#step-list').addEventListener('dblclick',e=>{const row=e.target.closest('[data-row]');if(!row)return;const n=Number(row.dataset.row);selection=[n];anchor=n;call('selectSteps',String(n));render();delayModal()});
if(host){window.chrome.webview.addEventListener('message',e=>{const d=e.data;if(!d)return;if(d.type==='state'){const old=S.selected;S=d;if(old!==S.selected||JSON.stringify(selection)!==JSON.stringify(S.rows)){selection=S.rows.slice();anchor=selection.length?selection[selection.length-1]:0}render()}else if(d.type==='toast')toast(d.text);else if(d.type==='updateCheck'){if(d.status==='available')openModal('Доступно обновление',`<p>Текущая версия: <strong>${esc(d.installed)}</strong></p><p>Новая версия: <strong>${esc(d.version)}</strong></p><p>После подтверждения программа закроется, обновлятор заменит программные файлы и запустит её снова. Пользовательские макросы и изображения сохранятся.</p>`,()=>{call('applyUpdate');closeModal()},{okText:'Установить обновление'});else if(d.status==='latest')openModal('Обновлений нет',`<p>Установлена актуальная версия <strong>${esc(d.installed)}</strong>.</p>`,null,{noOK:true});else openModal('Не удалось проверить обновления',`<p>${esc(d.message||'Проверь подключение к интернету и попробуй ещё раз.')}</p>`,null,{noOK:true});}else if(d.type==='closeModal')closeModal();else if(d.type==='capturedHotkey'){if(keyPickerActive&&window.__applyCapturedMouseKey)window.__applyCapturedMouseKey(d.key)}else if(d.type==='imagePicked'){previewPath=d.path;previewData=d.preview;if($('#img-path'))$('#img-path').value=previewPath;if($('#image-preview'))$('#image-preview').innerHTML=previewData?`<img src="${esc(previewData)}" alt="Образец">`:'<span class="fallback">Изображение выбрано</span>'}});call('ready')}
render();
</script>
