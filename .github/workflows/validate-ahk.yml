name: Validate AutoHotkey v2
on:
  push:
    branches: [main, updates]
  workflow_dispatch:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download official AutoHotkey v2 portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/AutoHotkey/AutoHotkey/releases/download/v2.0.32/AutoHotkey_2.0.32.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\ahk.zip"
          $hash = (Get-FileHash "$env:RUNNER_TEMP\ahk.zip" -Algorithm SHA256).Hash
          if ($hash -ne '384A4C125E8D7B5B77DDBD5A593EC761D3E9E96E97A95931CF56E9A077FDA114') {
            throw "AutoHotkey download checksum mismatch"
          }
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\ahk.zip" -DestinationPath "$env:RUNNER_TEMP\ahk"

      - name: Download pinned WebViewToo library
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $revision = '53fc321984d1ad9665038950f5ef4cedd1face35'
          Invoke-WebRequest -Uri "https://codeload.github.com/The-CoDingman/WebViewToo/zip/$revision" -OutFile "$env:RUNNER_TEMP\webviewtoo.zip"
          Expand-Archive -LiteralPath "$env:RUNNER_TEMP\webviewtoo.zip" -DestinationPath "$env:RUNNER_TEMP\webviewtoo"
          $lib = Join-Path "$env:RUNNER_TEMP\webviewtoo" "WebViewToo-$revision\Lib"
          Copy-Item -LiteralPath $lib -Destination (Join-Path $env:GITHUB_WORKSPACE 'Lib') -Recurse -Force

      - name: Validate source without executing macro
        shell: pwsh
        run: |
          $exe = Get-ChildItem -LiteralPath "$env:RUNNER_TEMP\ahk" -Filter AutoHotkey64.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'AutoHotkey64.exe not found' }
          $errPath = Join-Path $env:RUNNER_TEMP 'ahk_errors.txt'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @('/ErrorStdOut=UTF-8', '/Validate', "`"$env:GITHUB_WORKSPACE\MouseMacro_WebView.ahk`"") -Wait -PassThru -RedirectStandardError $errPath
          if (Test-Path $errPath) { Get-Content $errPath | ForEach-Object { Write-Host $_ } }
          Write-Host "AHK validator exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "AHK syntax validation failed with exit code $($p.ExitCode)" }
